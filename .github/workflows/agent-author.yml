name: agent-author
run-name: ticket #${{ inputs.issue }}
on:
  workflow_dispatch:
    inputs:
      issue:
        description: Issue number
        required: true
permissions:
  contents: read
  issues: read
concurrency: agent-${{ inputs.issue }}
jobs:
  author:
    runs-on: ubuntu-latest
    env:
      N: ${{ inputs.issue }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Fetch ticket
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [[ "$N" =~ ^[0-9]+$ ]] || { echo "bad issue number"; exit 1; }
          gh issue view "$N" --json title,body,labels > ticket.json
      - run: git checkout -b "agent/$N"
      - run: node scripts/agent.mjs author
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ vars.LLM_BASE_URL }}
          ISSUE_NUMBER: ${{ inputs.issue }}
          MODEL_ADA: ${{ vars.MODEL_ADA }}
          MODEL_BO: ${{ vars.MODEL_BO }}
          MODEL_QA: ${{ vars.MODEL_QA }}
      - name: Push, open PR, enable auto-merge
        env:
          GH_TOKEN: ${{ secrets.AGENT_TOKEN }}
        run: |
          git config user.name "factory-agent"
          git config user.email "agent@users.noreply.github.com"
          git add -A && git commit -m "agent: ticket #$N"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GH_REPO}.git" HEAD
          gh pr create --title "Ticket #$N" --body "Closes #$N" --base main --head "agent/$N"
          gh pr merge "agent/$N" --auto --squash
