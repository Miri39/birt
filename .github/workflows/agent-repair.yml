name: agent-repair
run-name: "repair ${{ github.event.workflow_run.head_branch }}"
on:
  workflow_run:
    workflows: [ci, agent-review]
    types: [completed]
permissions:
  contents: read
  issues: write
  pull-requests: write
concurrency:
  group: repair-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false
jobs:
  repair:
    if: >-
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      startsWith(github.event.workflow_run.head_branch, 'agent/')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_REPO: ${{ github.repository }}
      BRANCH: ${{ github.event.workflow_run.head_branch }}
      SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - name: Find the open PR for this exact commit
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          row=$(gh pr list --head "$BRANCH" --state open --json number,headRefOid --jq '.[0] // empty')
          if [ -z "$row" ]; then echo "no open PR, nothing to do"; exit 0; fi
          if [ "$(jq -r .headRefOid <<<"$row")" != "$SHA" ]; then echo "stale run, the branch moved on"; exit 0; fi
          echo "pr=$(jq -r .number <<<"$row")" >> "$GITHUB_OUTPUT"
      - if: steps.pr.outputs.pr != ''
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          persist-credentials: false
      - if: steps.pr.outputs.pr != ''
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 22 }
      - name: Count earlier repairs and load ticket and feedback
        if: steps.pr.outputs.pr != ''
        id: prep
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ steps.pr.outputs.pr }}
        run: |
          n="${BRANCH#agent/}"
          [[ "$n" =~ ^[0-9]+$ ]] || exit 1
          echo "N=$n" >> "$GITHUB_ENV"
          echo "done=$(git log origin/main..HEAD --format=%s | grep -c '^agent: repair' || true)" >> "$GITHUB_OUTPUT"
          gh issue view "$n" --json title,body,labels > ticket.json
          gh pr view "$PR" --json comments --jq '[.comments[] | select(.body | test("^\\*\\*(review|qa) "))] | .[-2:] | map(.body) | join("\n\n")' > verdict.md
      - if: steps.pr.outputs.pr != '' && steps.prep.outputs.done < 2
        run: npm ci
      - name: Repair
        if: steps.pr.outputs.pr != '' && steps.prep.outputs.done < 2
        id: repair
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ vars.LLM_BASE_URL }}
          ISSUE_NUMBER: ${{ env.N }}
          MODEL_ADA: ${{ vars.MODEL_ADA }}
          MODEL_BO: ${{ vars.MODEL_BO }}
          MODEL_QA: ${{ vars.MODEL_QA }}
        run: |
          node scripts/agent.mjs repair
          git add -A
          if git diff --cached --quiet; then echo "changed=false" >> "$GITHUB_OUTPUT"; else echo "changed=true" >> "$GITHUB_OUTPUT"; fi
      - name: Push the repair
        if: steps.repair.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.AGENT_TOKEN }}
          PR: ${{ steps.pr.outputs.pr }}
        run: |
          git config user.name "factory-agent"
          git config user.email "agent@users.noreply.github.com"
          git commit -m "agent: repair ticket #$N"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GH_REPO}.git" "HEAD:refs/heads/$BRANCH"
          if [ "$(cat selfcheck.status)" = pass ]; then
            gh pr edit "$PR" --title "Ticket #$N"
            gh pr merge "$PR" --auto --squash
          fi
      - name: Give up, close the PR and park the ticket
        if: steps.pr.outputs.pr != '' && (steps.prep.outputs.done >= 2 || steps.repair.outputs.changed == 'false')
        env:
          GH_TOKEN: ${{ github.token }}
          AGENT_TOKEN: ${{ secrets.AGENT_TOKEN }}
          PR: ${{ steps.pr.outputs.pr }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          GH_TOKEN="$AGENT_TOKEN" gh pr close "$PR" --delete-branch --comment "Repair gave up, see $RUN_URL. The ticket is parked."
          gh issue edit "$N" --remove-label in-progress --add-label needs-human
          gh issue comment "$N" --body "Pull request #$PR could not be repaired automatically and was closed. Parked as needs-human."
