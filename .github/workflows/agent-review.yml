name: agent-review
on: pull_request
permissions:
  contents: read
  issues: read
  pull-requests: write
env:
  GITHUB_TOKEN: ${{ github.token }}
  HEAD_REF: ${{ github.head_ref }}
  PR: ${{ github.event.pull_request.number }}
  LLM_BASE_URL: ${{ vars.LLM_BASE_URL }}
  MODEL_ADA: ${{ vars.MODEL_ADA }}
  MODEL_BO: ${{ vars.MODEL_BO }}
  MODEL_QA: ${{ vars.MODEL_QA }}
jobs:
  review:
    if: startsWith(github.head_ref, 'agent/')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 22 }
      - name: Fetch ticket
        run: |
          echo "ISSUE_NUMBER=${HEAD_REF#agent/}" >> "$GITHUB_ENV"
          gh issue view "${HEAD_REF#agent/}" --json title,body,labels > ticket.json
      - run: node scripts/agent.mjs review
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
      - if: always() && hashFiles('verdict.md') != ''
        run: gh pr comment "$PR" --body-file verdict.md
  qa:
    if: startsWith(github.head_ref, 'agent/')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 22, cache: npm }
      - name: Fetch ticket
        run: |
          echo "ISSUE_NUMBER=${HEAD_REF#agent/}" >> "$GITHUB_ENV"
          gh issue view "${HEAD_REF#agent/}" --json title,body,labels > ticket.json
      - run: npm ci && npm run build
      - run: node scripts/agent.mjs qa
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
      - if: always() && hashFiles('verdict.md') != ''
        run: gh pr comment "$PR" --body-file verdict.md
